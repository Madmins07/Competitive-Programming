<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Competitive Programming: 306 accepted solutions. Codeforces and LeetCode, in C++.">
<style>
  .sans{font-family:-apple-system,'Instrument Sans','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','Geist Mono','JetBrains Mono',Menlo,Consolas,monospace}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .blink{animation:blink 1.4s step-end infinite}
  .drift{animation:drift 14s ease-in-out infinite alternate}
  .drift2{animation:drift2 18s ease-in-out infinite alternate}
  .spin{transform-origin:center;animation:spin 40s linear infinite}
  .spinr{transform-origin:center;animation:spinr 60s linear infinite}
  .scan{animation:scan 9s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
  @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(50px,-30px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes scan{from{transform:translateY(-120%)}to{transform:translateY(120%)}}
</style>
<defs>
  <clipPath id="bf"><rect width="1000" height="240" rx="18"/></clipPath>
  <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bsoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="bsoft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="bdots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#202723"/>
  </pattern>
  <linearGradient id="bsage" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5A6A60"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="bsagev" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A6BDAD"/><stop offset="1" stop-color="#5A6A60"/>
  </linearGradient>
  <linearGradient id="binkfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EEF1ED"/><stop offset="1" stop-color="#A6BDAD"/>
  </linearGradient>
  <linearGradient id="bhair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#788A7F" stop-opacity="0"/><stop offset=".5" stop-color="#A6BDAD"/><stop offset="1" stop-color="#788A7F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bfadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bfadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0B0E0D"/><stop offset="1" stop-color="#0B0E0D" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#bf)">
<rect width="1000" height="240" fill="#0B0E0D"/>
<rect width="1000" height="240" fill="url(#bdots)" opacity=".55"/>
<ellipse cx="860" cy="110" rx="220" ry="130" fill="#788A7F" opacity="0.22" filter="url(#bsoft)" class="drift"/>
<ellipse cx="120" cy="230" rx="260" ry="90" fill="#5A6A60" opacity="0.18" filter="url(#bsoft)" class="drift2"/>
<g class="spin" style="transform-origin:866px 120px"><circle cx="866" cy="120" r="74" fill="none" stroke="#5A6A60" stroke-width="1" stroke-dasharray="3 7"/><circle cx="940" cy="120" r="3" fill="#A6BDAD" filter="url(#bglow)"/></g>
<g class="spinr" style="transform-origin:866px 120px"><circle cx="866" cy="120" r="48" fill="none" stroke="#788A7F" stroke-width="1" stroke-dasharray="40 24" opacity=".8"/><circle cx="866" cy="72" r="2.4" fill="#EEF1ED"/></g>
<circle cx="866" cy="120" r="22" fill="none" stroke="#A6BDAD" stroke-width="1.2" stroke-dasharray="138" stroke-dashoffset="138"><animate attributeName="stroke-dashoffset" values="138;0" begin=".4s" dur="1.6s" fill="freeze"/></circle>
<circle cx="866" cy="120" r="4.5" fill="#A6BDAD" class="pulse" filter="url(#bglow)"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.1s" dur="0.6s" fill="freeze"/>
<text x="48" y="60" class="mono" font-size="10.5" fill="#788A7F" letter-spacing="2.2">MADMINS07  /  COMPETITIVE-PROGRAMMING</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.25s" dur="0.7s" fill="freeze"/>
<text x="48" y="118" class="sans" font-size="44" fill="#EEF1ED" font-weight="700" letter-spacing="-1.4">Competitive Programming</text>
</g>
<rect x="48" y="134" width="0" height="1.5" fill="url(#bsage)"><animate attributeName="width" values="0;220" begin=".7s" dur=".9s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.55s" dur="0.7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.55s" dur="0.7s" fill="freeze"/>
<text x="48" y="162" class="sans" font-size="15.5" fill="#C2C9C3">306 accepted solutions. Codeforces and LeetCode, in C++.</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.85s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.85s" dur="0.6s" fill="freeze"/>
<rect x="48" y="184" width="58" height="24" rx="12.0" fill="#111614" stroke="#202723"/><text x="77.0" y="199.6" class="mono" font-size="10.5" fill="#A6BDAD" font-weight="600" text-anchor="middle" letter-spacing="1.4">C++17</text>
<rect x="114" y="184" width="93" height="24" rx="12.0" fill="#111614" stroke="#202723"/><text x="160.5" y="199.6" class="mono" font-size="10.5" fill="#A6BDAD" font-weight="600" text-anchor="middle" letter-spacing="1.4">CODEFORCES</text>
<rect x="215" y="184" width="79" height="24" rx="12.0" fill="#111614" stroke="#202723"/><text x="254.5" y="199.6" class="mono" font-size="10.5" fill="#A6BDAD" font-weight="600" text-anchor="middle" letter-spacing="1.4">LEETCODE</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.4s" dur="0.6s" fill="freeze"/>
<text x="952" y="60" class="mono" font-size="10.5" fill="#7E8781" text-anchor="end" letter-spacing="2.2">ARCHIVE  ·  2023 → 2024</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.5s" dur="0.6s" fill="freeze"/>
<text x="952" y="205" class="mono" font-size="10.5" fill="#7E8781" text-anchor="end" letter-spacing="2.2">C++</text>
</g>
</g>
<rect x=".5" y=".5" width="999" height="239" rx="18" fill="none" stroke="#202723"/>
</svg>
